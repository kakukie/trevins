version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trevins-app
    restart: unless-stopped
    ports:
      - "8384:3000"
    env_file:
      - .env.production
    volumes:
      - ./public/images:/app/public/images
      - ./logs:/app/logs
    networks:
      - trevins-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: trevins-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "8182:81"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./public/images:/app/public/images
    networks:
      - trevins-network

volumes:
  caddy_data:
  caddy_config:

networks:
  trevins-network:
    driver: bridge
